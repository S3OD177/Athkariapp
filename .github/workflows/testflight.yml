name: TestFlight Upload

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Type YES to archive and upload to App Store Connect.
        required: true
        default: "NO"

concurrency:
  group: testflight-upload
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and Upload
    runs-on: macos-latest
    timeout-minutes: 60
    if: ${{ github.event.inputs.upload == 'YES' }}

    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Prepare App Store Connect API key
        run: |
          set -euo pipefail

          if [ -z "${ASC_KEY_ID}" ] || [ -z "${ASC_ISSUER_ID}" ] || [ -z "${ASC_KEY_BASE64}" ]; then
            echo "Missing App Store Connect API secrets."
            echo "Required: APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_API_ISSUER_ID, APP_STORE_CONNECT_API_KEY_BASE64"
            exit 1
          fi

          mkdir -p private_keys
          echo "${ASC_KEY_BASE64}" | base64 --decode > "private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Athkariapp.xcodeproj \
            -scheme Athkariapp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Athkariapp.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"

      - name: Upload to App Store Connect
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Athkariapp.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ci/ExportOptions-AppStoreConnect.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"

