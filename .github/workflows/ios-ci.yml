name: iOS CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and Test
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select simulator
        id: simulator
        run: |
          set -euo pipefail

          DEVICE_NAME="$(
            xcrun simctl list devices available |
            awk -F '[()]' '/iPhone/ && /Shutdown|Booted/ {
              name=$1
              sub(/^[[:space:]]+/, "", name)
              sub(/[[:space:]]+$/, "", name)
              print name
              exit
            }'
          )"

          if [ -z "$DEVICE_NAME" ]; then
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi

          echo "device=$DEVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $DEVICE_NAME"

      - name: Run tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project Athkariapp.xcodeproj \
            -scheme Athkariapp \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device }}"
